<script>
Deck.slide("s05-hub1", function (el, tl, h) {
  h.rise(".c5-h", { at: 0, y: 30 });
  h.rise(".door", { at: 0.2, y: 80, stagger: 0.12 });
  h.pop(".star", { at: 0.7 });
  h.slideIn(".c5-me", { at: 0.6, x: -80 });
  h.fade(".c5-hint", { at: 0.9 });

});
</script>
