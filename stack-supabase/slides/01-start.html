<section class="slide" id="s01-start" data-title="Portada: Lánzala" data-footer="off" data-enter="fade">
  <template class="notes">⏱ 20 s
«Hola, somos Jorge y Dani.»
«Hoy os enseñamos el stack con el que montamos proyectos de noche: Supabase, GitHub y Vercel.»
(clic en cualquiera de los dos monigotes: saluda)</template>
  <style>
    #s01-start .c1-cl { position: absolute; }
    #s01-start .c1-cl.a { left: 90px; top: 120px; width: 300px; }
    #s01-start .c1-cl.b { right: 150px; top: 70px; width: 230px; }
    #s01-start .c1-cl.d { left: 1580px; top: 330px; width: 250px; }
    #s01-start .c1-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    #s01-start .c1-hey { font-size: 30px; font-weight: 600; color: #fff; text-shadow: 0 2px 14px rgba(16,52,110,.35); }
    #s01-start .c1-kick { margin-top: 30px; font-size: 44px; font-weight: 700; letter-spacing: -0.02em; }
    #s01-start .c1-title { margin-top: 48px; font-size: 200px; }
    #s01-start .c1-sub { margin-top: 48px; max-width: 1180px; }
    #s01-start .c1-press { margin-top: 64px; }
    #s01-start .c1-credit { position: absolute; left: 0; right: 0; bottom: 40px; display: flex; justify-content: center; align-items: center; gap: 22px; }
    #s01-start .c1-lg { height: 72px; width: auto; display: block; }
    #s01-start .c1-x { font-size: 26px; color: #fff; }
    #s01-start .c1-who { font-size: 20px; color: #fff; text-shadow: 2px 2px 0 rgba(11,13,16,.4); margin-left: 18px; }
    #s01-start .c1-me { position: absolute; top: 740px; width: 330px; }
    #s01-start .c1-me.l { left: 100px; }
    #s01-start .c1-me.r { right: 100px; }
    #s01-start .c1-me .c1-sp { display: block; width: 120px; margin: 0 auto -16px; position: relative; z-index: 1; }
    #s01-start .c1-me .c1-pl { display: block; width: 330px; }
  </style>
  <span class="c1-cl a pcloud" data-px="cloud"></span>
  <span class="c1-cl b pcloud" data-px="cloud"></span>
  <span class="c1-cl d pcloud" data-px="cloud"></span>
  <div class="c1-me l"><span class="c1-sp shadow-px" data-px="jorge" data-anim="wave"></span><span class="c1-pl" data-px="cloud"></span></div>
  <div class="c1-me r"><span class="c1-sp shadow-px" data-px="invitado" data-anim="idle"></span><span class="c1-pl" data-px="cloud"></span></div>
  <div class="c1-wrap">
    <div class="c1-hey">👋&nbsp; Hey, somos Jorge y Dani</div>
    <div class="sub-sky c1-kick">No esperes a tenerla perfecta:</div>
    <div class="pxt-hero c1-title">Lánzala</div>
    <div class="sub-sky c1-sub">Supabase, GitHub y Vercel: de tu portátil a internet</div>
    <button class="px-btn c1-press" type="button" data-next>▶ Pulsa para empezar</button>
  </div>
  <div class="c1-credit"><img class="c1-lg" src="assets/img/logos/uc3m.png" alt="UC3M"><span class="c1-x pxt">×</span><img class="c1-lg" src="assets/img/logos/aws.png" alt="AWS"><span class="pxt c1-who">Jorge Garcelán y Dani Jiménez · Máster de Informática · 2026</span></div>
</section>
<script>
Deck.slide("s01-start", function (el, tl, h) {
  h.fade(".c1-cl", { at: 0, stagger: 0.1 });
  h.fade(".c1-hey", { at: 0.1 });
  h.rise(".c1-kick", { at: 0.15, y: 20 });
  var t = h.split(".c1-title", "chars");
  tl.fromTo(t.chars, { yPercent: 120, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.5, ease: "steps(4)", stagger: 0.05 }, 0.25);
  h.rise(".c1-sub", { at: 0.9, y: 20 });
  h.rise(".c1-me.l", { at: 1.0, y: 60 });
  h.rise(".c1-me.r", { at: 1.15, y: 60 });
  h.pop(".c1-press", { at: 1.3 });
  h.fade(".c1-credit", { at: 1.4 });
  tl.call(Deck.sfx, ["start", tl], 0.3);
  h.loop(function () { return gsap.to(el.querySelectorAll(".c1-cl"), { x: function (i) { return i % 2 ? -40 : 40; }, duration: 6, repeat: -1, yoyo: true, ease: "sine.inOut" }); });
  h.loop(function () { return gsap.to(el.querySelector(".c1-press"), { opacity: 0.25, duration: 0.6, repeat: -1, yoyo: true, ease: "steps(1)" }); });
  h.loop(function () { return gsap.to(el.querySelectorAll(".c1-me"), { y: -14, duration: 1.6, repeat: -1, yoyo: true, ease: "sine.inOut", stagger: 0.8 }); });
});
</script>
