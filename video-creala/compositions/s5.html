    // zoom through a door of the map: the door fills the frame, the world behind it takes over

      tl.set(S(hub), { opacity: 0 }, t + 0.02);
    }
    // back out of a world: the map pops out of the door it was entered through

      tl.set(S(i), { opacity: 1 }, t);
      tl.fromTo(S(i), { scale: 2.6, transformOrigin: ox + "px " + oy + "px" }, { scale: 1, duration: 0.45, ease: "expo.out", immediateRender: false }, t);
